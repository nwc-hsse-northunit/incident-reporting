<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إجراءات الإبلاغ عن الحوادث — وحدة أعمال الشمال القطاع الشرقي | شركة المياه الوطنية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap">
<style>
:root{
  /* NWC 2026 identity */
  --navy:#003462; --blue:#0071B9; --cyan:#0F9FD6; --green:#008973; --deep-green:#005959;
  --pale:#B9D8EA; --grey:#C6CDD1; --slate:#495965; --yellow:#EFB71B;

  --bg:#FFFFFF; --surface:#F1F7FB; --ink:#10283C; --muted:#495965; --line:#C6CDD1;
  --link:#0071B9; --acc-safety:#008973; --acc-safety-text:#005959; --acc-security:#0071B9; --acc-security-text:#0071B9;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#021A2E; --surface:#06304F; --ink:#E8F1F7; --muted:#B4C3CE; --line:#1F4663;
    --link:#6DBCEE; --acc-safety:#2FCDB0; --acc-safety-text:#2FCDB0; --acc-security:#4DB0EA; --acc-security-text:#6DBCEE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#021A2E; --surface:#06304F; --ink:#E8F1F7; --muted:#B4C3CE; --line:#1F4663;
  --link:#6DBCEE; --acc-safety:#2FCDB0; --acc-safety-text:#2FCDB0; --acc-security:#4DB0EA; --acc-security-text:#6DBCEE;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Almarai","Noto Sans Devanagari",system-ui,"Segoe UI",Tahoma,sans-serif;
  font-size:18px;line-height:1.9;-webkit-text-size-adjust:100%;
}
body[data-lang="ur"]{font-family:"Noto Naskh Arabic","Almarai",system-ui,Tahoma,sans-serif;line-height:2}
body[data-lang="hi"]{font-family:"Noto Sans Devanagari","Almarai",system-ui,sans-serif;line-height:1.85}
a{color:var(--link);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:4px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* white brand bar: the logo is dark-on-light, so this bar stays white in every theme */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:1px solid #D7E2E8}
.bar-in{max-width:880px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{display:block;height:84px;width:auto}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{font:inherit;font-size:14px;font-weight:700;line-height:1;padding:9px 13px;min-height:38px;border-radius:999px;cursor:pointer;border:1px solid #C6CDD1;background:#fff;color:#003462}
.langs button[aria-pressed="true"]{background:#003462;border-color:#003462;color:#fff}

.hero{background:var(--navy);color:#fff}
.hero-in{max-width:880px;margin:0 auto;padding:36px 20px 34px}
.hero-in::before{content:"";display:block;width:56px;height:5px;background:var(--yellow);border-radius:3px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,42px);line-height:1.35;font-weight:800}
.hero p{margin:0;color:var(--pale);font-size:19px;line-height:1.7;max-width:34em}
.contacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;min-height:46px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(185,216,234,.45);color:#fff;font-weight:700;font-size:17px;line-height:1.3}
.chip:hover{background:rgba(255,255,255,.2);text-decoration:none}
.chip svg{width:20px;height:20px;flex:none;color:var(--pale)}

main{max-width:880px;margin:0 auto;padding:36px 20px 16px}
section{margin:0 0 40px;padding-inline-start:20px;border-inline-start:5px solid var(--acc)}
#s1{--acc:var(--acc-safety);--acc-text:var(--acc-safety-text)}
#s2{--acc:var(--acc-security);--acc-text:var(--acc-security-text)}
.kicker{margin:0;color:var(--acc-text);font-size:17px;font-weight:700}
h2{margin:0 0 14px;font-size:clamp(24px,4.8vw,31px);line-height:1.45;font-weight:800;color:var(--ink)}
.kicker + h2{margin-top:2px}
h2 + .kicker{margin-top:-8px;margin-bottom:14px}
ol{margin:0;padding-inline-start:30px}
li{margin:0 0 14px;padding-inline-start:6px}
li::marker{color:var(--acc);font-weight:800}

footer{background:var(--navy);color:var(--pale);font-size:16px}
footer div{max-width:880px;margin:0 auto;padding:22px 20px 28px}
footer div::before{content:"";display:block;width:40px;height:4px;background:var(--yellow);border-radius:2px;margin-bottom:12px}
</style>
</head>

 title:"Incident Reporting Procedure",dept:"Industrial Security Department, Northern Business Unit, Eastern Sector",
 unit:"the Northern Business Unit, Eastern Sector",
 h1:"Occupational Incidents and Work Injuries",k1:"Safety Procedures",
 l1:["The injured person must immediately report to their direct supervisor any incident or work injury that happens to them.",
  "The direct supervisor or the site / project manager must immediately report any incident that results in a work injury, death, fire, hazardous material leak, damage to equipment or property, production disruption, or environmental harm, by calling the Security Control Center of the Eastern Sector on the direct line {phone}.",
  "Complete the unified Incident and Spill Report Form No. HSE_FM_010.01_00 with all information, and email it to the Security Control Center of the Eastern Sector at {email}.",
  "Record the work injury in the self-service system (ERP) for the injured employee with all required information, with the direct supervisor's approval."],
 k2:"Industrial Security",h2:"Security Incidents",
 l2:["All employees must report all security cases to their direct supervisor.",
  "The direct supervisor or the site / project manager must immediately report all security cases and incidents (a security, sabotage, or terrorist incident affecting assets) by calling the Security Control Center of the Eastern Sector immediately on the direct line {phone}.",
  "Complete the unified Incident and Spill Report Form No. HSE_FM_010.01_00 with all information, and email it to the Security Control Center of the Eastern Sector at {email}."],
 footer:"Industrial Security Department, Northern Business Unit, Eastern Sector"},
ur:{dir:"rtl",
 pagetitle:"واقعات کی رپورٹنگ کا طریقہ کار — شمالی بزنس یونٹ، مشرقی سیکٹر | نیشنل واٹر کمپنی",
 title:"واقعات کی رپورٹنگ کا طریقہ کار",dept:"انڈسٹریل سیکیورٹی ڈیپارٹمنٹ، شمالی بزنس یونٹ، مشرقی سیکٹر",
 unit:"شمالی بزنس یونٹ، مشرقی سیکٹر",
 h1:"پیشہ ورانہ حادثات اور کام کے دوران چوٹیں",k1:"حفاظتی طریقہ کار",
 l1:["زخمی شخص کو اپنے ساتھ پیش آنے والے کسی بھی حادثے یا کام کے دوران چوٹ کی اطلاع فوراً اپنے براہِ راست سپروائزر کو دینی چاہیے۔",
  "براہِ راست سپروائزر یا سائٹ / پروجیکٹ مینیجر کو ایسے کسی بھی حادثے کی فوری اطلاع دینی چاہیے جس کے نتیجے میں کام کے دوران چوٹ، موت، آگ، خطرناک مواد کا اخراج، آلات یا املاک کو نقصان، پیداوار میں رکاوٹ یا ماحول کو نقصان ہو۔ اس کے لیے مشرقی سیکٹر کے سیکیورٹی کنٹرول سینٹر کو براہِ راست فون نمبر {phone} پر کال کریں۔",
  "حادثات اور اخراج کی اطلاع کا متحدہ فارم نمبر HSE_FM_010.01_00 مکمل معلومات کے ساتھ بھریں اور اسے مشرقی سیکٹر کے سیکیورٹی کنٹرول سینٹر کے ای میل {email} پر بھیجیں۔",
  "زخمی ملازم کی کام کے دوران چوٹ کو سیلف سروس سسٹم (ERP) میں تمام مطلوبہ معلومات کے ساتھ درج کریں، اور براہِ راست سپروائزر سے منظوری حاصل کریں۔"],
 k2:"انڈسٹریل سیکیورٹی",h2:"سیکیورٹی واقعات",
 l2:["تمام ملازمین کو تمام سیکیورٹی معاملات کی اطلاع اپنے براہِ راست سپروائزر کو دینی چاہیے۔",
  "براہِ راست سپروائزر یا سائٹ / پروجیکٹ مینیجر کو تمام سیکیورٹی معاملات اور واقعات (اثاثوں کو متاثر کرنے والا سیکیورٹی، تخریبی یا دہشت گردی کا واقعہ) کی فوراً اطلاع دینی چاہیے۔ اس کے لیے مشرقی سیکٹر کے سیکیورٹی کنٹرول سینٹر کو براہِ راست فون نمبر {phone} پر فوراً کال کریں۔",
  "حادثات اور اخراج کی اطلاع کا متحدہ فارم نمبر HSE_FM_010.01_00 مکمل معلومات کے ساتھ بھریں اور اسے مشرقی سیکٹر کے سیکیورٹی کنٹرول سینٹر کے ای میل {email} پر بھیجیں۔"],
 footer:"انڈسٹریل سیکیورٹی ڈیپارٹمنٹ، شمالی بزنس یونٹ، مشرقی سیکٹر"},
hi:{dir:"ltr",
 pagetitle:"घटना रिपोर्टिंग प्रक्रिया — उत्तरी व्यावसायिक इकाई, पूर्वी सेक्टर | नेशनल वॉटर कंपनी",
 title:"घटना रिपोर्टिंग प्रक्रिया",dept:"औद्योगिक सुरक्षा विभाग, उत्तरी व्यावसायिक इकाई, पूर्वी सेक्टर",
 unit:"उत्तरी व्यावसायिक इकाई, पूर्वी सेक्टर",
 h1:"व्यावसायिक घटनाएँ और कार्य-संबंधी चोटें",k1:"सुरक्षा प्रक्रियाएँ",
 l1:["घायल व्यक्ति को अपने साथ हुई किसी भी घटना या कार्य-संबंधी चोट की सूचना तुरंत अपने प्रत्यक्ष पर्यवेक्षक को देनी चाहिए।",
  "प्रत्यक्ष पर्यवेक्षक या साइट / प्रोजेक्ट प्रबंधक को ऐसी किसी भी घटना की तुरंत सूचना देनी चाहिए जिसके परिणामस्वरूप कार्य-संबंधी चोट, मृत्यु, आग, खतरनाक पदार्थों का रिसाव, उपकरणों या संपत्ति को क्षति, उत्पादन में बाधा या पर्यावरण को हानि हो। इसके लिए पूर्वी सेक्टर के सुरक्षा नियंत्रण केंद्र को सीधी लाइन {phone} पर कॉल करें।",
  "घटना एवं रिसाव रिपोर्ट का एकीकृत फ़ॉर्म संख्या HSE_FM_010.01_00 पूरी जानकारी के साथ भरें और पूर्वी सेक्टर के सुरक्षा नियंत्रण केंद्र के ईमेल {email} पर भेजें।",
  "घायल कर्मचारी की कार्य-संबंधी चोट को सेल्फ-सर्विस सिस्टम (ERP) में सभी आवश्यक जानकारी के साथ दर्ज करें, और प्रत्यक्ष पर्यवेक्षक की स्वीकृति लें।"],
 k2:"औद्योगिक सुरक्षा",h2:"सुरक्षा घटनाएँ",
 l2:["सभी कर्मचारियों को सभी सुरक्षा मामलों की सूचना अपने प्रत्यक्ष पर्यवेक्षक को देनी चाहिए।",
  "प्रत्यक्ष पर्यवेक्षक या साइट / प्रोजेक्ट प्रबंधक को सभी सुरक्षा मामलों और घटनाओं (संपत्तियों को प्रभावित करने वाली सुरक्षा, तोड़फोड़ या आतंकी घटना) की तुरंत सूचना देनी चाहिए। इसके लिए पूर्वी सेक्टर के सुरक्षा नियंत्रण केंद्र को सीधी लाइन {phone} पर तुरंत कॉल करें।",
  "घटना एवं रिसाव रिपोर्ट का एकीकृत फ़ॉर्म संख्या HSE_FM_010.01_00 पूरी जानकारी के साथ भरें और पूर्वी सेक्टर के सुरक्षा नियंत्रण केंद्र के ईमेल {email} पर भेजें।"],
 footer:"औद्योगिक सुरक्षा विभाग, उत्तरी व्यावसायिक इकाई, पूर्वी सेक्टर"}
};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fill(str,d){
  return esc(str)
    .replace(/\{unit\}/g,esc(d.unit))
    .replace(/\{phone\}/g,'<a class="num" href="tel:'+PHONE_RAW+'">'+PHONE_RAW+'</a>')
    .replace(/\{email\}/g,'<a class="num" href="mailto:'+EMAIL+'">'+EMAIL+'</a>');
}

function render(lang){
  var d=T[lang]||T.ar, root=document.documentElement;
  root.lang=lang; root.dir=d.dir; document.body.setAttribute("data-lang",lang);
  document.title=d.pagetitle;
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=d[el.getAttribute("data-i18n")]});
  document.querySelectorAll(".langs button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-set")===lang)});
  document.getElementById("list1").innerHTML=d.l1.map(function(x){return "<li>"+fill(x,d)+"</li>"}).join("");
  document.getElementById("list2").innerHTML=d.l2.map(function(x){return "<li>"+fill(x,d)+"</li>"}).join("");
  document.getElementById("chip-phone").href="tel:"+PHONE_RAW;
  document.getElementById("chip-phone-t").textContent=PHONE_SHOW;
  document.getElementById("chip-mail").href="mailto:"+EMAIL;
  document.getElementById("chip-mail-t").textContent=EMAIL;
}

document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click",function(){
    var l=b.getAttribute("data-set");
    try{localStorage.setItem("lang",l)}catch(_){}
    render(l);
  });
});
var start="ar";
try{var s=localStorage.getItem("lang"); if(s&&T[s]) start=s;}catch(_){}
render(start);
</script>
</body>
</html>
